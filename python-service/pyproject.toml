[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  | venv
  | .venv
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
known_third_party = ["fastapi", "pydantic", "yfinance", "pandas", "numpy", "scipy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
